<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#111111"/>
  <!-- Dating Tax: two silhouettes, one fading -->
  <g fill="#C9975A">
    <!-- Left figure (solid) -->
    <g opacity="0.4">
      <ellipse cx="155" cy="90" rx="30" ry="34"/>
      <path d="M125 140 Q140 132 155 131 Q170 132 185 140 L192 285 Q170 295 155 296 Q140 295 118 285 Z"/>
    </g>
    <!-- Right figure (fading/ghosted) -->
    <g opacity="0.12">
      <ellipse cx="245" cy="90" rx="30" ry="34"/>
      <path d="M215 140 Q230 132 245 131 Q260 132 275 140 L282 285 Q260 295 245 296 Q230 295 208 285 Z"/>
    </g>
  </g>
  <!-- Ghost dots trailing right -->
  <circle cx="290" cy="190" r="5" fill="#C9975A" opacity="0.15"/>
  <circle cx="310" cy="185" r="3.5" fill="#C9975A" opacity="0.1"/>
  <circle cx="325" cy="180" r="2.5" fill="#C9975A" opacity="0.07"/>
  <!-- Label -->
  <text x="200" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#C9975A" letter-spacing="4" font-weight="600">TYPE C</text>
  <text x="200" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#555" letter-spacing="2">THE DATING TAX</text>
</svg>
