<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#111111"/>
  <!-- 2am Mirror: figure looking at mirror reflection -->
  <g fill="#C9975A">
    <!-- Mirror frame -->
    <rect x="240" y="60" width="95" height="260" rx="10" fill="none" stroke="#C9975A" stroke-width="2" opacity="0.25"/>
    <!-- Mirror surface (slightly lighter) -->
    <rect x="248" y="68" width="79" height="244" rx="6" fill="#1a1408" opacity="0.8"/>
    <!-- Figure (dark side) -->
    <g opacity="0.3">
      <ellipse cx="145" cy="95" rx="32" ry="36"/>
      <path d="M113 148 Q128 140 145 139 Q162 140 177 148 L185 290 Q162 302 145 303 Q128 302 105 290 Z"/>
      <path d="M113 150 L82 230 Q78 238 81 242 L96 246 L118 165 Z"/>
      <path d="M177 150 L208 230 Q212 238 209 242 L194 246 L172 165 Z"/>
    </g>
    <!-- Mirror reflection (dimmer, slightly different) -->
    <g opacity="0.15">
      <ellipse cx="287" cy="95" rx="30" ry="34"/>
      <path d="M257 146 Q270 138 287 137 Q304 138 317 146 L324 288 Q304 299 287 300 Q270 299 250 288 Z"/>
    </g>
    <!-- Harsh light beam from above mirror -->
    <path d="M287 68 L260 30 Q287 20 314 30 Z" fill="#C9975A" opacity="0.06"/>
  </g>
  <!-- 2am clock label -->
  <text x="145" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#C9975A" opacity="0.35" font-style="italic">2:14 AM</text>
  <!-- Label -->
  <text x="200" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#C9975A" letter-spacing="4" font-weight="600">TYPE D</text>
  <text x="200" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#555" letter-spacing="2">THE 2AM MIRROR</text>
</svg>
