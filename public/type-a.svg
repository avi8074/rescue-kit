<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#111111"/>
  <!-- Body silhouette: hoodie-wearing figure -->
  <g opacity="0.35" fill="#C9975A">
    <!-- head -->
    <ellipse cx="200" cy="80" rx="40" ry="45"/>
    <!-- hoodie body - wide/boxy -->
    <path d="M120 160 Q150 140 200 138 Q250 140 280 160 L295 310 Q250 325 200 326 Q150 325 105 310 Z"/>
    <!-- hood detail -->
    <path d="M155 145 Q200 125 245 145 Q240 165 200 170 Q160 165 155 145 Z" fill="#0d0d0d" opacity="0.5"/>
    <!-- kangaroo pocket -->
    <rect x="155" y="240" width="90" height="50" rx="8" fill="#0d0d0d" opacity="0.4"/>
  </g>
  <!-- Label -->
  <text x="200" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#C9975A" letter-spacing="4" font-weight="600" text-transform="uppercase">TYPE A</text>
  <text x="200" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#555" letter-spacing="2">THE HOODIE EFFECT</text>
</svg>
