<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#111111"/>
  <!-- Macro Prison: figure surrounded by calorie tracking bars -->
  <g opacity="0.35" fill="#C9975A">
    <!-- head -->
    <ellipse cx="200" cy="85" rx="36" ry="40"/>
    <!-- thin body -->
    <path d="M165 145 Q180 138 200 137 Q220 138 235 145 L245 300 Q220 312 200 313 Q180 312 155 300 Z"/>
    <!-- arms down, slim -->
    <path d="M165 148 L130 240 Q125 248 128 252 L145 256 L168 170 Z"/>
    <path d="M235 148 L270 240 Q275 248 272 252 L255 256 L232 170 Z"/>
  </g>
  <!-- Bar chart grid lines (prison bars metaphor) -->
  <line x1="110" y1="100" x2="110" y2="320" stroke="#C9975A" stroke-width="1.5" opacity="0.15"/>
  <line x1="145" y1="100" x2="145" y2="320" stroke="#C9975A" stroke-width="1.5" opacity="0.15"/>
  <line x1="255" y1="100" x2="255" y2="320" stroke="#C9975A" stroke-width="1.5" opacity="0.15"/>
  <line x1="290" y1="100" x2="290" y2="320" stroke="#C9975A" stroke-width="1.5" opacity="0.15"/>
  <!-- 1200 cal label -->
  <text x="200" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#C9975A" opacity="0.5" font-weight="700">1,200 kcal</text>
  <!-- Label -->
  <text x="200" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#C9975A" letter-spacing="4" font-weight="600">TYPE B</text>
  <text x="200" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#555" letter-spacing="2">MACRO PRISON</text>
</svg>
